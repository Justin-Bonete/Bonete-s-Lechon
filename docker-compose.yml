services:
  backend:
    build: ./infrastructure/docker/backend
    container_name: bonetes_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [bonetes]

  nginx:
    image: nginx:1.27-alpine
    container_name: bonetes_nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [bonetes]

  postgres:
    image: postgres:16-alpine
    container_name: bonetes_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bonetes_lechons}
      POSTGRES_USER: ${DB_USERNAME:-bonetes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bonetes} -d ${DB_DATABASE:-bonetes_lechons}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bonetes]

  redis:
    image: redis:7-alpine
    container_name: bonetes_redis
    volumes:
      - redisdata:/data
    networks: [bonetes]

  frontend:
    build: ./infrastructure/docker/frontend
    container_name: bonetes_frontend
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://nginx
    depends_on: [nginx]
    networks: [bonetes]

networks:
  bonetes:

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
